name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          # The degradation library alone, with its python bindings and the
          # test of its installed CMake package.
          - name: degradations, gcc, Release
            packages: python3-dev python3-numpy python3-pytest python3-build python3-setuptools python3-wheel
            cmake: >-
              -DCMAKE_BUILD_TYPE=Release
              -DBUILD_ONLY_DEGRADATIONS=ON
              -DBUILD_OTHER_PROGS=ON
              -DBUILD_PYTHON_WRAPPER=ON

          # BUILD_OTHER_PROGS: the 3D step of DocCreatorDegradator is only
          # built with OSMesa.
          - name: degradations with OSMesa, gcc, Release
            packages: libosmesa6-dev
            cmake: >-
              -DCMAKE_BUILD_TYPE=Release
              -DBUILD_ONLY_DEGRADATIONS=ON
              -DBUILD_WITH_OSMESA=ON
              -DBUILD_OTHER_PROGS=ON

          # tests/Degradations/testConcurrency.cpp calls every degradation
          # from eight threads at once: it was written for this job.
          - name: degradations, clang, ThreadSanitizer
            packages: clang
            cmake: >-
              -DCMAKE_BUILD_TYPE=RelWithDebInfo
              -DCMAKE_C_COMPILER=clang
              -DCMAKE_CXX_COMPILER=clang++
              -DBUILD_ONLY_DEGRADATIONS=ON
              -DSANITIZER=thread

          # Everything, with Qt 6. Leptonica and tesseract are built from
          # sources, as they are not found. The installation is checked by
          # DocCreator --self-test.
          - name: full, clang, Release
            packages: clang qt6-base-dev
            selftest: true
            cmake: >-
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_C_COMPILER=clang
              -DCMAKE_CXX_COMPILER=clang++
              -DBUILD_OTHER_PROGS=ON

          # Qt 5 is still supported (cf. the root CMakeLists.txt), with the
          # tesseract of the distribution, whose models FindTesseract finds.
          - name: full, gcc, Qt 5, system tesseract, Release
            packages: qtbase5-dev libqt5opengl5-dev libqt5xmlpatterns5-dev libtesseract-dev libleptonica-dev tesseract-ocr-eng tesseract-ocr-fra
            selftest: true
            cmake: >-
              -DCMAKE_BUILD_TYPE=Release
              -DDOCCREATOR_QT_VERSION=5

          - name: full, gcc, AddressSanitizer + UndefinedBehaviorSanitizer
            packages: qt6-base-dev
            cmake: >-
              -DCMAKE_BUILD_TYPE=RelWithDebInfo
              -DSANITIZER=address+undefined

          # Debug, so -Wall and _GLIBCXX_ASSERTIONS too. The coverage target
          # runs the tests and writes the report.
          - name: full, gcc, Debug, coverage
            packages: qt6-base-dev python3-dev python3-numpy python3-pytest python3-build python3-setuptools python3-wheel gcovr
            coverage: true
            cmake: >-
              -DCMAKE_BUILD_TYPE=Debug
              -DBUILD_OTHER_PROGS=ON
              -DBUILD_PYTHON_WRAPPER=ON
              -DENABLE_COVERAGE=ON

    env:
      # cf. cmake/sanitizers/README.txt
      ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/cmake/sanitizers/lsan.supp
      UBSAN_OPTIONS: suppressions=${{ github.workspace }}/cmake/sanitizers/ubsan.supp:print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: suppressions=${{ github.workspace }}/cmake/sanitizers/tsan.supp:second_deadlock_stack=1:halt_on_error=1

    steps:
      - uses: actions/checkout@v7

      # The kernel of the runner randomizes the mappings over more bits
      # than ThreadSanitizer supports ("unexpected memory mapping").
      - name: Reduce the address space randomization for ThreadSanitizer
        if: ${{ contains(matrix.cmake, 'SANITIZER=thread') }}
        run: sudo sysctl vm.mmap_rnd_bits=28

      # git: leptonica and tesseract are cloned when they are built from
      # sources.
      - name: Install the dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ git libopencv-dev ${{ matrix.packages }}

      # The tesseract models, which the configuration of DocCreator
      # downloads and checks.
      - name: Cache the tesseract models
        if: ${{ !contains(matrix.cmake, 'BUILD_ONLY_DEGRADATIONS=ON') }}
        uses: actions/cache@v6
        with:
          path: thirdparty/tessdata
          key: tessdata-${{ hashFiles('software/DocCreator/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DBUILD_TESTING=ON ${{ matrix.cmake }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        if: ${{ !matrix.coverage }}
        run: ctest --test-dir build --output-on-failure --parallel 4

      # The installed program, out of the build tree: its data, fonts,
      # image formats and tesseract models, and a document rendered.
      - name: Install, and check the installation
        if: ${{ matrix.selftest }}
        run: |
          cmake --install build --prefix "$PWD/install"
          QT_QPA_PLATFORM=offscreen install/bin/DocCreator --version
          QT_QPA_PLATFORM=offscreen install/bin/DocCreator --self-test

      # ctest writes the list of the failed tests only when some fail,
      # and does not remove an older one: cf. the check below.
      - name: Test, and write the coverage report
        if: ${{ matrix.coverage }}
        run: |
          rm -f build/Testing/Temporary/LastTestsFailed.log
          cmake --build build --target coverage

      - name: Upload the coverage report
        if: ${{ matrix.coverage }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: build/coverage/
          if-no-files-found: error
          retention-days: 14

      # The coverage target writes its report even when tests fail, and
      # only warns: ctest's list of the failed tests says whether they did.
      - name: Check that the tests passed
        if: ${{ matrix.coverage }}
        run: |
          failed=build/Testing/Temporary/LastTestsFailed.log
          if [ -s "$failed" ]; then
            echo "Failed tests:"
            cat "$failed"
            exit 1
          fi

  # The image of bundlers/Dockerfile, which builds and checks DocCreator
  # (--self-test) from this tree.
  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -f bundlers/Dockerfile -t doccreator .

  # The wheel of the python module, made by
  # wrapper/python/build_wheels_manylinux.sh in its manylinux container,
  # repaired by auditwheel, installed and tested out of the build tree.
  wheel:
    name: manylinux wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Build, repair and test the wheel
        run: >-
          docker run --rm -e PYTHON_VERSIONS=cp312-cp312 -v "$PWD":/io
          quay.io/pypa/manylinux_2_28_x86_64
          /io/wrapper/python/build_wheels_manylinux.sh
      - name: Upload the wheel
        uses: actions/upload-artifact@v7
        with:
          name: DocCreatorPy-manylinux-wheel
          path: WHEELS/*.whl
          if-no-files-found: error
          retention-days: 14

  windows:
    name: ${{ matrix.name }}
    runs-on: windows-2025
    timeout-minutes: 150

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows, degradations, MSVC, Release
            generator: Ninja
            config: Release
            cmake: >-
              -DBUILD_ONLY_DEGRADATIONS=ON
              -DBUILD_OTHER_PROGS=ON

          # Leptonica and tesseract are built from sources, as on Linux.
          - name: Windows, full, MSVC, Release, installer
            generator: Ninja
            config: Release
            qt: true
            installer: true
            cmake: >-
              -DBUILD_OTHER_PROGS=ON

          # A multi-config generator, in Debug: the tesseract built from
          # sources was linked with the names of its Release libraries,
          # which only showed with Visual Studio in Debug.
          - name: Windows, full, Visual Studio, Debug
            generator: Visual Studio 17 2022
            config: Debug
            qt: true
            cmake: ""

    steps:
      # The test data must be compared as they are in the repository, not
      # with CRLF line endings.
      - name: Keep the line endings of the repository
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      # Pinned: the version of the prebuilt OpenCV of Chocolatey changes
      # the names of its DLLs (opencv_world<version>.dll).
      - name: Install OpenCV and ninja
        run: |
          choco install opencv --version=4.13.0 -y --no-progress
          choco install ninja -y --no-progress
          $bin = (Get-ChildItem C:\tools\opencv\build\x64\vc*\bin | Select-Object -Last 1).FullName
          "$bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # It also adds Qt's bin directory, with its DLLs, to the PATH.
      - name: Install Qt
        if: ${{ matrix.qt }}
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache the tesseract models
        if: ${{ !contains(matrix.cmake, 'BUILD_ONLY_DEGRADATIONS=ON') }}
        uses: actions/cache@v6
        with:
          path: thirdparty/tessdata
          key: tessdata-${{ hashFiles('software/DocCreator/CMakeLists.txt') }}

      - name: Configure with Ninja
        if: ${{ matrix.generator == 'Ninja' }}
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DOpenCV_DIR=C:/tools/opencv/build
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DCMAKE_INSTALL_PREFIX="$PWD/install"
          -DBUILD_TESTING=ON
          ${{ matrix.cmake }}

      - name: Configure with Visual Studio
        if: ${{ matrix.generator != 'Ninja' }}
        run: >-
          cmake -S . -B build -G "${{ matrix.generator }}" -A x64
          -DOpenCV_DIR=C:/tools/opencv/build
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DCMAKE_INSTALL_PREFIX="$PWD/install"
          -DBUILD_TESTING=ON
          ${{ matrix.cmake }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure --parallel 4

      # The DLLs of Qt (windeployqt) and OpenCV are installed by cmake
      # --install, in the prefix it is given. --self-test checks the
      # installation, with only the DLLs installed with it and the system
      # ones: a missing DLL or missing data used to show a dialog, which
      # kept the process alive and passed the old check.
      - name: Install, and check the installation
        if: ${{ matrix.qt }}
        run: |
          cmake --install build --config ${{ matrix.config }} --prefix "$PWD/install-check"
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          $exe = "$PWD\install-check\programs\DocCreator.exe"
          $p = Start-Process $exe -ArgumentList '--self-test' -NoNewWindow -PassThru `
                 -RedirectStandardOutput selftest.txt -RedirectStandardError selftest-err.txt
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "DocCreator --self-test did not exit" }
          Get-Content selftest.txt, selftest-err.txt
          if ($p.ExitCode) { throw "DocCreator --self-test exited with $($p.ExitCode)" }

      # The installer packages the programs/ and share/ directories of the
      # install prefix. A second installer, of a fake version 9.9.9, is
      # made from the same files, to test an upgrade and an installation
      # side by side. -WX: a warning of makensis fails the job.
      - name: Make the installers
        if: ${{ matrix.installer }}
        run: |
          cmake --install build
          choco install nsis -y --no-progress
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          & $makensis -V2 -WX build\bundlers\win\DocCreator.nsi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $makensis -V2 -WX -DPRODUCT_VERSION=9.9.9 build\bundlers\win\DocCreator.nsi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # The runner is thrown away afterwards: install, run and uninstall for
      # real, silently (/S).
      - name: Install, upgrade, install side by side, and uninstall
        if: ${{ matrix.installer }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem build\bundlers\win\DocCreator-*_setup.exe | Where-Object Name -ne 'DocCreator-9.9.9_setup.exe'
          $version = $setup.Name -replace '^DocCreator-(.*)_setup\.exe$', '$1'
          $setup9 = Get-Item build\bundlers\win\DocCreator-9.9.9_setup.exe
          $dir = "$env:ProgramFiles\DocCreator"
          $dir9 = "$env:ProgramFiles\DocCreator-9.9.9"
          $uninst = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall'
          $appPaths = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\DocCreator.exe'
          $installs = 'HKLM:\SOFTWARE\DocCreator\Installs'
          $desktop = "$env:PUBLIC\Desktop"

          function Run($exe, $arguments) {
            $p = Start-Process $exe -ArgumentList $arguments -Wait -PassThru
            if ($p.ExitCode) { throw "$exe $arguments exited with $($p.ExitCode)" }
          }
          # _?= : the uninstaller runs from its folder, and is waited for. It
          # does not remove itself, nor its folder with it.
          function Uninstall($d) {
            Run "$d\uninst.exe" @('/S', "_?=$d")
            Remove-Item "$d\uninst.exe"
          }
          function Expect($cond, $what) { if (-not $cond) { throw "expected: $what" } }
          function SelfTest($d) {
            $saved = $env:PATH
            $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
            $p = Start-Process "$d\programs\DocCreator.exe" -ArgumentList '--self-test' -NoNewWindow -PassThru `
                   -RedirectStandardOutput selftest.txt -RedirectStandardError selftest-err.txt
            if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "DocCreator --self-test did not exit" }
            $env:PATH = $saved
            Get-Content selftest.txt
            if ($p.ExitCode) { throw "DocCreator --self-test in $d exited with $($p.ExitCode)" }
          }
          function AppPath() { (Get-ItemProperty $appPaths).'(default)' }

          # 1. a first installation
          Run $setup.FullName @('/S')
          foreach ($f in "$dir\programs\DocCreator.exe", "$dir\share\DocCreator\data", "$dir\uninst.exe", "$desktop\DocCreator $version.lnk") {
            Expect (Test-Path $f) "installed: $f"
          }
          Expect (Test-Path "$uninst\DocCreator-$version") "the uninstall key of $version, in the 64-bit registry"
          Expect ((Get-ItemProperty "$uninst\DocCreator-$version").QuietUninstallString) "a quiet uninstall string"
          Expect ((AppPath) -eq "$dir\programs\DocCreator.exe") "App Paths names the program of $version"
          SelfTest $dir

          # 2. 9.9.9 side by side: both are installed
          Run $setup9.FullName @('/S', '/SIDEBYSIDE')
          foreach ($f in "$dir\programs\DocCreator.exe", "$dir9\programs\DocCreator.exe", "$desktop\DocCreator $version.lnk", "$desktop\DocCreator 9.9.9.lnk", "$uninst\DocCreator-$version", "$uninst\DocCreator-9.9.9") {
            Expect (Test-Path $f) "side by side: $f"
          }
          Expect ((AppPath) -eq "$dir9\programs\DocCreator.exe") "App Paths names the program of 9.9.9"
          SelfTest $dir9

          # 3. 9.9.9 uninstalled: $version is still there, and App Paths is
          # given back to it
          Uninstall $dir9
          foreach ($f in "$dir9\programs\DocCreator.exe", "$desktop\DocCreator 9.9.9.lnk", "$uninst\DocCreator-9.9.9") {
            Expect (-not (Test-Path $f)) "uninstalled: $f"
          }
          foreach ($f in "$dir\programs\DocCreator.exe", "$desktop\DocCreator $version.lnk", "$uninst\DocCreator-$version") {
            Expect (Test-Path $f) "kept: $f"
          }
          Expect ((AppPath) -eq "$dir\programs\DocCreator.exe") "App Paths given back to $version"

          # 4. 9.9.9 as an upgrade (the default): it replaces $version
          Run $setup9.FullName @('/S')
          Expect (Test-Path "$dir\programs\DocCreator.exe") "upgraded: the program"
          Expect (Test-Path "$uninst\DocCreator-9.9.9") "upgraded: the uninstall key of 9.9.9"
          foreach ($f in "$uninst\DocCreator-$version", "$desktop\DocCreator $version.lnk") {
            Expect (-not (Test-Path $f)) "replaced: $f"
          }
          Expect ((@((Get-Item $installs).GetValueNames()) -join ',') -eq '9.9.9') "only 9.9.9 is listed as installed"
          SelfTest $dir

          # 5. files that were not installed, in directories that were: the
          # uninstaller must keep them (it used to delete programs\ and
          # share\ with everything in them)
          New-Item -ItemType Directory -Force "$dir\share\Other" | Out-Null
          $foreign = "$dir\programs\not-installed.txt", "$dir\share\Other\not-installed.txt"
          foreach ($f in $foreign) { Set-Content -Path $f -Value 'not installed' }
          Uninstall $dir
          foreach ($f in "$dir\programs\DocCreator.exe", "$dir\programs\platforms", "$dir\share\DocCreator", "$desktop\DocCreator 9.9.9.lnk", "$uninst\DocCreator-9.9.9", $appPaths, 'HKLM:\SOFTWARE\DocCreator') {
            Expect (-not (Test-Path $f)) "uninstalled: $f"
          }
          foreach ($f in $foreign) {
            Expect (Test-Path $f) "kept although not installed: $f"
          }
          Remove-Item $setup9.FullName

      - name: Upload the installer
        if: ${{ matrix.installer }}
        uses: actions/upload-artifact@v7
        with:
          name: DocCreator-Windows-installer
          path: build/bundlers/win/DocCreator-*_setup.exe
          if-no-files-found: error
          # already compressed by makensis
          compression-level: 0
          retention-days: 14

  # Apple silicon. Clang's UBSan checks more than gcc's (float-cast-overflow,
  # for example), and arm64 contracts floating point operations in fused
  # multiply-adds by default: both have caught bugs that the linux and
  # windows jobs did not see.
  macos:
    name: ${{ matrix.name }}
    runs-on: macos-15
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          # Everything, with the python bindings and the bundle. Qt comes
          # from its installer and OpenCV is built from sources: macdeployqt
          # puts them in the application, which the Qt of Homebrew, split in
          # several prefixes, and its OpenCV, with its many dependencies, do
          # not allow. Leptonica and tesseract are built from sources, as
          # they are not found.
          - name: macOS, full, AppleClang, Release
            qt: true
            opencv_from_sources: true
            python: true
            bundle: true
            cmake: >-
              -DCMAKE_BUILD_TYPE=Release
              -DBUILD_OTHER_PROGS=ON
              -DBUILD_PYTHON_WRAPPER=ON

          - name: macOS, degradations, AppleClang, AddressSanitizer + UndefinedBehaviorSanitizer
            packages: opencv
            cmake: >-
              -DCMAKE_BUILD_TYPE=RelWithDebInfo
              -DBUILD_ONLY_DEGRADATIONS=ON
              -DSANITIZER=address+undefined

    env:
      # cf. cmake/sanitizers/README.txt. LeakSanitizer is not supported on
      # Apple silicon: detect_leaks=1 would stop every test.
      ASAN_OPTIONS: detect_stack_use_after_return=1
      UBSAN_OPTIONS: suppressions=${{ github.workspace }}/cmake/sanitizers/ubsan.supp:print_stacktrace=1:halt_on_error=1
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
      OPENCV_VERSION: 5.0.0
      OPENCV_SHA256: b0528f5a1d379d59d4701cb28c36e22214cc51cf64594e5b56f2d3e6c0233095

    steps:
      - uses: actions/checkout@v7

      - name: Install the dependencies
        run: |
          brew install ninja ${{ matrix.packages }}
          echo "DEPS_PREFIX_PATH=$(brew --prefix)" >> "$GITHUB_ENV"

      - name: Install Qt
        if: ${{ matrix.qt }}
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      # The modules of OpenCV that DocCreator uses, and the image formats
      # it builds itself: nothing that the application would have to carry.
      # The last part of the key changes with the options of the build.
      - name: Cache OpenCV
        if: ${{ matrix.opencv_from_sources }}
        id: cache-opencv
        uses: actions/cache@v6
        with:
          path: ~/opencv
          key: opencv-${{ env.OPENCV_VERSION }}-${{ runner.os }}-${{ runner.arch }}-1

      - name: Build OpenCV
        if: ${{ matrix.opencv_from_sources && steps.cache-opencv.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/opencv-src"
          cd "$RUNNER_TEMP/opencv-src"
          curl -sSL -o opencv.tar.gz "https://github.com/opencv/opencv/archive/refs/tags/$OPENCV_VERSION.tar.gz"
          echo "$OPENCV_SHA256  opencv.tar.gz" | shasum -a 256 -c -
          tar xzf opencv.tar.gz
          cmake -S "opencv-$OPENCV_VERSION" -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/opencv" \
            -DBUILD_LIST=core,imgproc,imgcodecs,highgui,photo,geometry,videoio \
            -DENABLE_FAST_MATH=ON -DBUILD_DOCS=OFF -DBUILD_PERF_TESTS=OFF \
            -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_opencv_apps=OFF \
            -DBUILD_JAVA=OFF -DWITH_CUDA=OFF -DWITH_FFMPEG=OFF \
            -DWITH_OPENJPEG=OFF -DWITH_JASPER=OFF -DWITH_OPENCL=OFF \
            -DWITH_OPENEXR=OFF -DWITH_VTK=OFF -DWITH_WEBP=OFF -DWITH_AVIF=OFF \
            -DWITH_EIGEN=OFF -DWITH_PROTOBUF=OFF \
            -DPYTHON3_EXECUTABLE="" -DPYTHON2_EXECUTABLE="" \
            -DBUILD_ZLIB=ON -DBUILD_PNG=ON -DBUILD_JPEG=ON -DBUILD_TIFF=ON
          cmake --build build --parallel
          cmake --install build

      - name: Use Qt and OpenCV
        if: ${{ matrix.opencv_from_sources }}
        run: echo "DEPS_PREFIX_PATH=$HOME/opencv;$QT_ROOT_DIR" >> "$GITHUB_ENV"

      # The python of Homebrew does not let pip install packages
      - uses: actions/setup-python@v7
        if: ${{ matrix.python }}
        with:
          python-version: '3.13'

      - name: Install the python packages
        if: ${{ matrix.python }}
        run: |
          python -m pip install numpy pytest build setuptools wheel
          echo "PYTHON_CMAKE=-DPython_EXECUTABLE=$(which python)" >> "$GITHUB_ENV"

      - name: Cache the tesseract models
        if: ${{ !contains(matrix.cmake, 'BUILD_ONLY_DEGRADATIONS=ON') }}
        uses: actions/cache@v6
        with:
          path: thirdparty/tessdata
          key: tessdata-${{ hashFiles('software/DocCreator/CMakeLists.txt') }}

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DBUILD_TESTING=ON
          -DCMAKE_PREFIX_PATH="$DEPS_PREFIX_PATH"
          -DCMAKE_INSTALL_PREFIX="$PWD/install"
          $PYTHON_CMAKE ${{ matrix.cmake }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

      # mac_bundle.sh checks that the application only depends on the
      # system and on itself. make_dmg.sh writes the dmg in the current
      # directory.
      - name: Make the application bundle and the dmg
        if: ${{ matrix.bundle }}
        run: |
          cmake --install build
          mkdir bundle
          cd bundle
          sh ../build/bundlers/mac/mac_bundle.sh "$PWD"

      # The application of the dmg, as a user gets it: --self-test checks
      # that it finds its data and models in its bundle, and renders a
      # document.
      - name: Launch the application of the dmg
        if: ${{ matrix.bundle }}
        run: |
          dmg=$(ls bundle/*.dmg)
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          app=$(ls -d "$mnt"/*.app)
          status=0
          "$app/Contents/MacOS/DocCreator" --version || status=$?
          "$app/Contents/MacOS/DocCreator" --self-test || status=$?
          hdiutil detach "$mnt"
          exit $status

      - name: Upload the dmg
        if: ${{ matrix.bundle }}
        uses: actions/upload-artifact@v7
        with:
          name: DocCreator-macOS-dmg
          path: bundle/*.dmg
          if-no-files-found: error
          retention-days: 14
