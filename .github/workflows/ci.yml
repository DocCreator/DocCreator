name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          # The degradation library alone, with its python bindings and the
          # test of its installed CMake package.
          - name: degradations, gcc, Release
            packages: python3-dev python3-numpy python3-pytest python3-build python3-setuptools python3-wheel
            cmake: >-
              -DCMAKE_BUILD_TYPE=Release
              -DBUILD_ONLY_DEGRADATIONS=ON
              -DBUILD_OTHER_PROGS=ON
              -DBUILD_PYTHON_WRAPPER=ON

          - name: degradations with OSMesa, gcc, Release
            packages: libosmesa6-dev
            cmake: >-
              -DCMAKE_BUILD_TYPE=Release
              -DBUILD_ONLY_DEGRADATIONS=ON
              -DBUILD_WITH_OSMESA=ON

          # Everything, with Qt 6. Leptonica and tesseract are built from
          # sources, as they are not found.
          - name: full, clang, Release
            packages: clang qt6-base-dev
            cmake: >-
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_C_COMPILER=clang
              -DCMAKE_CXX_COMPILER=clang++
              -DBUILD_OTHER_PROGS=ON

          - name: full, gcc, AddressSanitizer + UndefinedBehaviorSanitizer
            packages: qt6-base-dev
            cmake: >-
              -DCMAKE_BUILD_TYPE=RelWithDebInfo
              -DSANITIZER=address+undefined

          # Debug, so -Wall and _GLIBCXX_ASSERTIONS too. The coverage target
          # runs the tests and writes the report.
          - name: full, gcc, Debug, coverage
            packages: qt6-base-dev python3-dev python3-numpy python3-pytest python3-build python3-setuptools python3-wheel gcovr
            coverage: true
            cmake: >-
              -DCMAKE_BUILD_TYPE=Debug
              -DBUILD_OTHER_PROGS=ON
              -DBUILD_PYTHON_WRAPPER=ON
              -DENABLE_COVERAGE=ON

    env:
      # cf. cmake/sanitizers/README.txt
      ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/cmake/sanitizers/lsan.supp
      UBSAN_OPTIONS: suppressions=${{ github.workspace }}/cmake/sanitizers/ubsan.supp:print_stacktrace=1:halt_on_error=1

    steps:
      - uses: actions/checkout@v7

      # git: leptonica and tesseract are cloned when they are built from
      # sources.
      - name: Install the dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ git libopencv-dev ${{ matrix.packages }}

      # The tesseract models, which the configuration of DocCreator
      # downloads and checks.
      - name: Cache the tesseract models
        if: ${{ !contains(matrix.cmake, 'BUILD_ONLY_DEGRADATIONS=ON') }}
        uses: actions/cache@v6
        with:
          path: thirdparty/tessdata
          key: tessdata-${{ hashFiles('software/DocCreator/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DBUILD_TESTING=ON ${{ matrix.cmake }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        if: ${{ !matrix.coverage }}
        run: ctest --test-dir build --output-on-failure --parallel 4

      # ctest writes the list of the failed tests only when some fail,
      # and does not remove an older one: cf. the check below.
      - name: Test, and write the coverage report
        if: ${{ matrix.coverage }}
        run: |
          rm -f build/Testing/Temporary/LastTestsFailed.log
          cmake --build build --target coverage

      - name: Upload the coverage report
        if: ${{ matrix.coverage }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: build/coverage/

      # The coverage target writes its report even when tests fail, and
      # only warns: ctest's list of the failed tests says whether they did.
      - name: Check that the tests passed
        if: ${{ matrix.coverage }}
        run: |
          failed=build/Testing/Temporary/LastTestsFailed.log
          if [ -s "$failed" ]; then
            echo "Failed tests:"
            cat "$failed"
            exit 1
          fi

  windows:
    name: ${{ matrix.name }}
    runs-on: windows-2025
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows, degradations, MSVC, Release
            cmake: >-
              -DBUILD_ONLY_DEGRADATIONS=ON
              -DBUILD_OTHER_PROGS=ON

          # Leptonica and tesseract are built from sources, as on Linux.
          - name: Windows, full, MSVC, Release
            qt: true
            cmake: >-
              -DBUILD_OTHER_PROGS=ON

    steps:
      # The test data must be compared as they are in the repository, not
      # with CRLF line endings.
      - name: Keep the line endings of the repository
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Install OpenCV and ninja
        run: |
          choco install opencv ninja -y --no-progress
          $bin = (Get-ChildItem C:\tools\opencv\build\x64\vc*\bin | Select-Object -Last 1).FullName
          "$bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # It also adds Qt's bin directory, with its DLLs, to the PATH.
      - name: Install Qt
        if: ${{ matrix.qt }}
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true

      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache the tesseract models
        if: ${{ !contains(matrix.cmake, 'BUILD_ONLY_DEGRADATIONS=ON') }}
        uses: actions/cache@v6
        with:
          path: thirdparty/tessdata
          key: tessdata-${{ hashFiles('software/DocCreator/CMakeLists.txt') }}

      # Release only: the tesseract built from sources is not found in Debug
      # (cf. README.md).
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DOpenCV_DIR=C:/tools/opencv/build
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DBUILD_TESTING=ON
          ${{ matrix.cmake }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

  # Apple silicon. Clang's UBSan checks more than gcc's (float-cast-overflow,
  # for example), and arm64 contracts floating point operations in fused
  # multiply-adds by default: both have caught bugs that the linux and
  # windows jobs did not see.
  macos:
    name: ${{ matrix.name }}
    runs-on: macos-15
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          # Everything, with the python bindings and the bundle. Qt comes
          # from its installer and OpenCV is built from sources: macdeployqt
          # puts them in the application, which the Qt of Homebrew, split in
          # several prefixes, and its OpenCV, with its many dependencies, do
          # not allow. Leptonica and tesseract are built from sources, as
          # they are not found.
          - name: macOS, full, AppleClang, Release
            qt: true
            opencv_from_sources: true
            python: true
            bundle: true
            cmake: >-
              -DCMAKE_BUILD_TYPE=Release
              -DBUILD_OTHER_PROGS=ON
              -DBUILD_PYTHON_WRAPPER=ON

          - name: macOS, degradations, AppleClang, AddressSanitizer + UndefinedBehaviorSanitizer
            packages: opencv
            cmake: >-
              -DCMAKE_BUILD_TYPE=RelWithDebInfo
              -DBUILD_ONLY_DEGRADATIONS=ON
              -DSANITIZER=address+undefined

    env:
      # cf. cmake/sanitizers/README.txt. LeakSanitizer is not supported on
      # Apple silicon: detect_leaks=1 would stop every test.
      ASAN_OPTIONS: detect_stack_use_after_return=1
      UBSAN_OPTIONS: suppressions=${{ github.workspace }}/cmake/sanitizers/ubsan.supp:print_stacktrace=1:halt_on_error=1
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
      OPENCV_VERSION: 5.0.0
      OPENCV_SHA256: b0528f5a1d379d59d4701cb28c36e22214cc51cf64594e5b56f2d3e6c0233095

    steps:
      - uses: actions/checkout@v7

      - name: Install the dependencies
        run: |
          brew install ninja ${{ matrix.packages }}
          echo "DEPS_PREFIX_PATH=$(brew --prefix)" >> "$GITHUB_ENV"

      - name: Install Qt
        if: ${{ matrix.qt }}
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      # The modules of OpenCV that DocCreator uses, and the image formats
      # it builds itself: nothing that the application would have to carry.
      # The last part of the key changes with the options of the build.
      - name: Cache OpenCV
        if: ${{ matrix.opencv_from_sources }}
        id: cache-opencv
        uses: actions/cache@v6
        with:
          path: ~/opencv
          key: opencv-${{ env.OPENCV_VERSION }}-${{ runner.os }}-${{ runner.arch }}-1

      - name: Build OpenCV
        if: ${{ matrix.opencv_from_sources && steps.cache-opencv.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/opencv-src"
          cd "$RUNNER_TEMP/opencv-src"
          curl -sSL -o opencv.tar.gz "https://github.com/opencv/opencv/archive/refs/tags/$OPENCV_VERSION.tar.gz"
          echo "$OPENCV_SHA256  opencv.tar.gz" | shasum -a 256 -c -
          tar xzf opencv.tar.gz
          cmake -S "opencv-$OPENCV_VERSION" -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/opencv" \
            -DBUILD_LIST=core,imgproc,imgcodecs,highgui,photo,geometry,videoio \
            -DENABLE_FAST_MATH=ON -DBUILD_DOCS=OFF -DBUILD_PERF_TESTS=OFF \
            -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_opencv_apps=OFF \
            -DBUILD_JAVA=OFF -DWITH_CUDA=OFF -DWITH_FFMPEG=OFF \
            -DWITH_OPENJPEG=OFF -DWITH_JASPER=OFF -DWITH_OPENCL=OFF \
            -DWITH_OPENEXR=OFF -DWITH_VTK=OFF -DWITH_WEBP=OFF -DWITH_AVIF=OFF \
            -DWITH_EIGEN=OFF -DWITH_PROTOBUF=OFF \
            -DPYTHON3_EXECUTABLE="" -DPYTHON2_EXECUTABLE="" \
            -DBUILD_ZLIB=ON -DBUILD_PNG=ON -DBUILD_JPEG=ON -DBUILD_TIFF=ON
          cmake --build build --parallel
          cmake --install build

      - name: Use Qt and OpenCV
        if: ${{ matrix.opencv_from_sources }}
        run: echo "DEPS_PREFIX_PATH=$HOME/opencv;$QT_ROOT_DIR" >> "$GITHUB_ENV"

      # The python of Homebrew does not let pip install packages
      - uses: actions/setup-python@v7
        if: ${{ matrix.python }}
        with:
          python-version: '3.13'

      - name: Install the python packages
        if: ${{ matrix.python }}
        run: |
          python -m pip install numpy pytest build setuptools wheel
          echo "PYTHON_CMAKE=-DPython_EXECUTABLE=$(which python)" >> "$GITHUB_ENV"

      - name: Cache the tesseract models
        if: ${{ !contains(matrix.cmake, 'BUILD_ONLY_DEGRADATIONS=ON') }}
        uses: actions/cache@v6
        with:
          path: thirdparty/tessdata
          key: tessdata-${{ hashFiles('software/DocCreator/CMakeLists.txt') }}

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DBUILD_TESTING=ON
          -DCMAKE_PREFIX_PATH="$DEPS_PREFIX_PATH"
          -DCMAKE_INSTALL_PREFIX="$PWD/install"
          $PYTHON_CMAKE ${{ matrix.cmake }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

      # mac_bundle.sh checks that the application only depends on the
      # system and on itself. make_dmg.sh writes the dmg in the current
      # directory.
      - name: Make the application bundle and the dmg
        if: ${{ matrix.bundle }}
        run: |
          cmake --install build
          mkdir bundle
          cd bundle
          sh ../build/bundlers/mac/mac_bundle.sh "$PWD"

      - name: Upload the dmg
        if: ${{ matrix.bundle }}
        uses: actions/upload-artifact@v7
        with:
          name: DocCreator-macOS-dmg
          path: bundle/*.dmg
